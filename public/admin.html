<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Blues Jam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- PIN overlay -->
  <div class="pin-overlay" id="pin-overlay">
    <div class="pin-box">
      <h2>Admin Access</h2>
      <p style="color:#aaa; margin-top:0.5rem;">Enter the admin PIN</p>
      <input type="password" id="pin-input" maxlength="10" placeholder="PIN">
      <p id="pin-error" style="color:#e94560; display:none;">Wrong PIN. Try again.</p>
      <button onclick="verifyPin()">Enter</button>
      <button class="secondary" onclick="window.location.href='index.html'">Home</button>
    </div>
  </div>

  <!-- Admin content (hidden until PIN verified) -->
  <div id="admin-content" class="hidden">
    <h1>&#127925; Admin Panel &#127925;</h1>

    <div class="container">
      <p class="center mb-1" style="color:#aaa;">Manage the jam queue &mdash; reorder, delete, or reset</p>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Instrument</th>
            <th>Song</th>
            <th>Joined</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="admin-queue-body">
          <tr><td colspan="5" class="center">Loading...</td></tr>
        </tbody>
      </table>

      <div class="center mt-1">
        <button class="danger" onclick="resetQueue()">Reset Entire Queue</button>
      </div>

      <div class="center mt-1" style="padding:1rem; border:1px solid #2a2015; border-radius:10px;">
        <p style="color:#d4a647; font-weight:600; margin-bottom:0.5rem;">Solo Time Gate (Thursdays 20:30)</p>
        <label style="cursor:pointer; display:inline-flex; align-items:center; gap:0.5rem;">
          <input type="checkbox" id="solo-gate-toggle" onchange="toggleSoloGate()" style="width:auto; accent-color:#d4a647; transform:scale(1.4);">
          <span id="solo-gate-label" style="color:#aaa;">Loading...</span>
        </label>
      </div>
    </div>

    <div class="center mt-1">
      <button onclick="window.location.href='index.html'">Home</button>
      <button class="secondary" onclick="window.location.href='queue.html'">Public Queue</button>
      <button class="danger" onclick="logoutAdmin()">Log out admin</button>
    </div>
  </div>

  <script>
    let adminPin = "";
    const tbody = document.getElementById("admin-queue-body");

    // PIN entry on Enter key
    document.getElementById("pin-input").addEventListener("keyup", (e) => {
      if (e.key === "Enter") verifyPin();
    });

    async function verifyPin() {
      const pin = document.getElementById("pin-input").value.trim();
      const res = await fetch("/api/admin/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin })
      });

      if (res.ok) {
        adminPin = pin;
        localStorage.setItem("blues-jam-admin", "true");
        document.getElementById("pin-overlay").classList.add("hidden");
        document.getElementById("admin-content").classList.remove("hidden");
        loadQueue();
        loadSoloGate();
        connectSSE();
      } else {
        document.getElementById("pin-error").style.display = "block";
        document.getElementById("pin-input").value = "";
      }
    }

    function renderAdminQueue(queue) {
      if (!queue.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="center">Queue is empty</td></tr>';
        return;
      }

      // Group by position
      const positions = [...new Set(queue.map(p => p.position))].sort((a, b) => a - b);
      const maxPos = Math.max(...positions);
      const minPos = Math.min(...positions);

      const rows = [];
      const seen = new Set();
      for (const p of queue) {
        if (seen.has(p.position)) continue;
        seen.add(p.position);
        const members = queue.filter(m => m.position === p.position);
        rows.push(members);
      }

      tbody.innerHTML = rows.map(members => {
        const first = members[0];
        const isTop = first.position === minPos;
        const isBottom = first.position === maxPos;
        const rowClass = first.status === "played" ? "row-played" : first.status === "missing" ? "row-missing" : "";

        const isGroup = members.length > 1 || first.group_name;
        let nameCell, instrCell;

        if (isGroup) {
          nameCell = `<span class="badge">${first.group_name || "Group"}</span> ${members.map(m => m.name).join(", ")}`;
          instrCell = members.map(m => m.instrument).join(", ");
        } else {
          nameCell = first.name;
          instrCell = first.instrument;
        }

        const joinedTime = first.created_at ? formatTime(first.created_at) : "\u2014";

        return `
          <tr class="${rowClass}">
            <td>${first.position}</td>
            <td>${nameCell}</td>
            <td>${instrCell}</td>
            <td>${first.song || "\u2014"}</td>
            <td>${joinedTime}</td>
            <td class="actions">
              <button class="small secondary" onclick="moveUp(${first.position})" ${isTop ? "disabled" : ""}>&#8593;</button>
              <button class="small secondary" onclick="moveDown(${first.position})" ${isBottom ? "disabled" : ""}>&#8595;</button>
              <button class="small danger" onclick="deleteEntry(${first.id})">&#128465;</button>
              <button class="small btn-played" onclick="setStatus(${first.position},'played')">Played</button>
              <button class="small btn-missing" onclick="setStatus(${first.position},'missing')">Missing</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    function formatTime(utcStr) {
      const d = new Date(utcStr + "Z");
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    async function loadQueue() {
      const res = await fetch("/api/queue");
      const queue = await res.json();
      renderAdminQueue(queue);
    }

    function connectSSE() {
      const evtSource = new EventSource("/api/events");
      evtSource.onmessage = (event) => {
        renderAdminQueue(JSON.parse(event.data));
      };
    }

    async function moveUp(position) {
      await fetch(`/api/queue/${position}/move-up`, {
        method: "PATCH",
        headers: { "X-Admin-Pin": adminPin }
      });
    }

    async function moveDown(position) {
      await fetch(`/api/queue/${position}/move-down`, {
        method: "PATCH",
        headers: { "X-Admin-Pin": adminPin }
      });
    }

    async function deleteEntry(id) {
      if (!confirm("Remove this entry from the queue?")) return;
      await fetch(`/api/queue/${id}`, {
        method: "DELETE",
        headers: { "X-Admin-Pin": adminPin }
      });
    }

    async function setStatus(position, status) {
      await fetch(`/api/queue/${position}/status`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json", "X-Admin-Pin": adminPin },
        body: JSON.stringify({ status })
      });
    }

    async function resetQueue() {
      if (!confirm("This will clear the entire queue. Are you sure?")) return;
      await fetch("/api/queue", {
        method: "DELETE",
        headers: { "X-Admin-Pin": adminPin }
      });
    }

    // Solo time gate toggle
    async function loadSoloGate() {
      const res = await fetch("/api/settings/solo-gate");
      const data = await res.json();
      const toggle = document.getElementById("solo-gate-toggle");
      const label = document.getElementById("solo-gate-label");
      toggle.checked = data.enabled;
      label.textContent = data.enabled ? "ON — Solo only on Thursdays 20:30" : "OFF — Solo open anytime";
      label.style.color = data.enabled ? "#d4a647" : "#7cdf7c";
    }

    async function toggleSoloGate() {
      const toggle = document.getElementById("solo-gate-toggle");
      const res = await fetch("/api/settings/solo-gate", {
        method: "PATCH",
        headers: { "Content-Type": "application/json", "X-Admin-Pin": adminPin },
        body: JSON.stringify({ enabled: toggle.checked })
      });
      const data = await res.json();
      const label = document.getElementById("solo-gate-label");
      label.textContent = data.enabled ? "ON — Solo only on Thursdays 20:30" : "OFF — Solo open anytime";
      label.style.color = data.enabled ? "#d4a647" : "#7cdf7c";
    }

    function logoutAdmin() {
      localStorage.removeItem("blues-jam-admin");
      adminPin = "";
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
