<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-mode-title=" — Scan to Join">Stardust Blues Jam - Scan to Join</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #qr-canvas {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0;
    }
    #qr-canvas canvas {
      border-radius: 8px;
      border: 4px solid #d4a647;
    }
    body.theme-jazz #qr-canvas canvas { border-color: #4caf50; }
    .date-display {
      text-align: center;
      font-size: 1.1rem;
      color: #d4a647;
      margin-top: 0.5rem;
    }
    body.theme-jazz .date-display { color: #5ec46a; }
  </style>
</head>
<body>
  <div id="lang-switcher"></div>

  <h1 data-i18n="showQRTitle">Stardust Blues Jam</h1>
  <p class="subtitle" data-i18n="showQRSubtitle">Show this QR to let people join tonight's jam</p>

  <div class="container">
    <p class="date-display" id="today-date"></p>
    <div id="qr-canvas"></div>
    <p class="center" style="color:#aaa; font-size:0.85rem;" id="qr-url"></p>
  </div>

  <div class="center mt-1">
    <button onclick="window.location.href='index.html'" data-i18n="home">Home</button>
    <button class="secondary" onclick="window.location.href='queue.html'" data-i18n="viewQueue">View Queue</button>
  </div>

  <script src="i18n.js"></script>
  <script src="mode.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    // Sync jam mode for theme + branding
    syncMode();

    // Generate a URL with today's date so the QR changes daily
    const today = new Date();
    const dateStr = today.toISOString().split("T")[0]; // YYYY-MM-DD
    const baseUrl = window.location.origin;
    const qrUrl = `${baseUrl}/register.html?date=${dateStr}`;

    // Display date
    document.getElementById("today-date").textContent = today.toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });

    // Display URL
    document.getElementById("qr-url").textContent = qrUrl;

    // Generate QR — accent color depends on the jam mode
    const qrAccent = (typeof getModeMeta === "function") ? getModeMeta().accent : "#d4a647";
    new QRCode(document.getElementById("qr-canvas"), {
      text: qrUrl,
      width: 280,
      height: 280,
      colorDark: qrAccent,
      colorLight: (getMode && getMode() === "jazz") ? "#101a14" : "#1a1510",
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
