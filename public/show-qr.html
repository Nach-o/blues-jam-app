<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan to Join - Stardust Blues Jam</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #qr-canvas {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0;
    }
    #qr-canvas canvas {
      border-radius: 8px;
      border: 4px solid #d4a647;
    }
    .date-display {
      text-align: center;
      font-size: 1.1rem;
      color: #d4a647;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>&#127925; Stardust Blues Jam &#127925;</h1>
  <p class="subtitle">Show this QR to let people join tonight's jam</p>

  <div class="container">
    <p class="date-display" id="today-date"></p>
    <div id="qr-canvas"></div>
    <p class="center" style="color:#aaa; font-size:0.85rem;" id="qr-url"></p>
  </div>

  <div class="center mt-1">
    <button onclick="window.location.href='index.html'">Home</button>
    <button class="secondary" onclick="window.location.href='queue.html'">View Queue</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    // Generate a URL with today's date so the QR changes daily
    const today = new Date();
    const dateStr = today.toISOString().split("T")[0]; // YYYY-MM-DD
    const baseUrl = window.location.origin;
    const qrUrl = `${baseUrl}/register.html?date=${dateStr}`;

    // Display date
    document.getElementById("today-date").textContent = today.toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });

    // Display URL
    document.getElementById("qr-url").textContent = qrUrl;

    // Generate QR
    const canvas = document.createElement("canvas");
    document.getElementById("qr-canvas").appendChild(canvas);

    QRCode.toCanvas(canvas, qrUrl, {
      width: 280,
      margin: 2,
      color: {
        dark: "#d4a647",
        light: "#1a1510"
      }
    });
  </script>
</body>
</html>
