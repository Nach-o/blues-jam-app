<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jam Queue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>&#127925; Jam Queue &#127925;</h1>
  <p class="subtitle">"It's the music that keeps us all in line." &mdash; Robert Plant</p>

  <div class="container">
    <p class="center mb-1" style="color:#aaa;">Live performance order &mdash; updates automatically</p>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Instrument</th>
          <th>Song</th>
          <th>Type</th>
        </tr>
      </thead>
      <tbody id="queue-body">
        <tr><td colspan="5" class="center">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="center mt-1">
    <button onclick="window.location.href='index.html'">Home</button>
    <button class="secondary" onclick="window.location.href='register.html'">Join the Jam</button>
  </div>

  <div class="blues-quote">
    "I've been down so long, it looks like up to me."
    <span class="author">&mdash; Muddy Waters</span>
  </div>

  <script>
    const tbody = document.getElementById("queue-body");

    function renderQueue(queue) {
      if (!queue.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="center">No one signed up yet. Be the first!</td></tr>';
        return;
      }

      // Find the first position that is still "waiting" — that's "next up"
      const positions = [...new Set(queue.map(p => p.position))].sort((a, b) => a - b);
      let nextUpPosition = null;
      for (const pos of positions) {
        const atPos = queue.filter(p => p.position === pos);
        if (atPos[0].status === "waiting") {
          nextUpPosition = pos;
          break;
        }
      }

      // Group by position
      const rows = [];
      const seen = new Set();
      for (const p of queue) {
        if (seen.has(p.position)) continue;
        seen.add(p.position);
        const members = queue.filter(m => m.position === p.position);
        rows.push(members);
      }

      tbody.innerHTML = rows.map(members => {
        const first = members[0];
        let rowClass = "";
        if (first.status === "played") rowClass = "row-played";
        else if (first.status === "missing") rowClass = "row-missing";
        else if (first.position === nextUpPosition) rowClass = "row-next";

        const isGroup = members.length > 1 || first.group_name;
        let nameCell, instrCell;

        if (isGroup) {
          nameCell = `<span class="badge">${first.group_name || "Group"}</span> ${members.map(m => m.name).join(", ")}`;
          instrCell = members.map(m => m.instrument).join(", ");
        } else {
          nameCell = first.name;
          instrCell = first.instrument;
        }

        return `
          <tr class="${rowClass}">
            <td>${first.position}</td>
            <td>${nameCell}</td>
            <td>${instrCell}</td>
            <td>${first.song || "\u2014"}</td>
            <td>${isGroup ? "Group" : "Solo"}</td>
          </tr>
        `;
      }).join("");
    }

    // Initial load
    fetch("/api/queue").then(r => r.json()).then(renderQueue);

    // Live updates via SSE
    const evtSource = new EventSource("/api/events");
    evtSource.onmessage = (event) => {
      renderQueue(JSON.parse(event.data));
    };
  </script>
</body>
</html>
