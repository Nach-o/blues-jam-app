<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jam Queue</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .join-form { display: none; margin-top: 0.5rem; }
    .join-form.active { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
    .join-form input { flex: 1; min-width: 100px; margin: 0; padding: 0.4rem; font-size: 0.85rem; }
    .join-form select { flex: 1; min-width: 100px; margin: 0; padding: 0.4rem; font-size: 0.85rem; }
    .btn-join { background: #2a5a2a !important; color: #7cdf7c !important; font-size: 0.75rem !important; padding: 0.25rem 0.5rem !important; }
    .btn-join:hover { background: #3a7a3a !important; }
    .btn-songs { background: #4a3a10 !important; color: #d4a647 !important; font-size: 0.75rem !important; padding: 0.25rem 0.5rem !important; }
    .btn-songs:hover { background: #5a4a20 !important; }
    .btn-edit { background: #2a2520 !important; font-size: 0.7rem !important; padding: 0.2rem 0.4rem !important; }
    .btn-edit:hover { background: #3a3025 !important; }
    .edit-song-row input { width: 100%; padding: 0.4rem; font-size: 0.85rem; }
    .songs-popup { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .songs-popup-box { background: linear-gradient(145deg, #1a1510, #12100d); border: 1px solid #2a2015; border-radius: 12px; padding: 1.5rem; max-width: 400px; width: 90%; }
    .songs-popup-box h3 { color: #d4a647; font-family: 'Playfair Display', serif; margin-bottom: 0.8rem; }
    .songs-popup-box ol { padding-left: 1.2rem; line-height: 2; color: #e8dcc8; }
    .songs-popup-box ol li { margin-bottom: 0.3rem; }
  </style>
</head>
<body>
  <div id="lang-switcher"></div>

  <h1 data-i18n="queueTitle">Orden de Actuación</h1>
  <p class="subtitle" data-i18n="liveOrder">Orden de actuación en vivo — se actualiza automáticamente</p>

  <div class="container">
    <table>
      <thead>
        <tr>
          <th data-i18n="colPos">#</th>
          <th data-i18n="colName">Nombre</th>
          <th data-i18n="colInstrument">Instrumento</th>
          <th data-i18n="colSong">Canción</th>
          <th data-i18n="colKey">Tono</th>
          <th data-i18n="colJoined">Hora</th>
          <th data-i18n="colType">Tipo</th>
        </tr>
      </thead>
      <tbody id="queue-body">
        <tr><td colspan="7" class="center" data-i18n="noOneYet">Nadie se ha apuntado aún. ¡Sé el primero!</td></tr>
      </tbody>
    </table>
  </div>

  <div class="center mt-1">
    <button onclick="window.location.href='index.html'" data-i18n="home">Inicio</button>
    <button class="secondary" onclick="window.location.href='help.html'" data-i18n="howItWorks">Cómo funciona</button>
    <button class="secondary" onclick="window.location.href='register.html'" data-i18n="joinBtn">Unirse al Stardust Blues Jam</button>
  </div>

  <script src="i18n.js"></script>
  <script src="songs.js"></script>
  <script>
    const INSTRUMENTS = ["vocals", "guitar", "bass", "drums", "keyboards", "harmonica", "other"];
    const REQUIRED = ["Guitar", "Bass", "Drums"];
    const MAX_GUITAR = 2;
    const tbody = document.getElementById("queue-body");

    function instrumentOptions() {
      return `<option value="">${t("instrumentPlaceholder")}</option>` +
        INSTRUMENTS.map(key => `<option value="${t(key)}">${t(key)}</option>`).join("");
    }

    // Check which instruments are still available for a group
    function availableInstruments(members) {
      const counts = {};
      members.forEach(m => {
        const n = normalizeLocal(m.instrument);
        counts[n] = (counts[n] || 0) + 1;
      });
      return INSTRUMENTS.filter(key => {
        const eng = key.charAt(0).toUpperCase() + key.slice(1); // vocals->Vocals etc
        const max = eng === "Guitar" ? MAX_GUITAR : 1;
        return (counts[eng] || 0) < max;
      });
    }

    // Simple client-side normalize (good enough for display logic)
    function normalizeLocal(instr) {
      const map = {};
      INSTRUMENTS.forEach(key => { map[t(key).toLowerCase()] = key.charAt(0).toUpperCase() + key.slice(1); });
      // Add English fallbacks
      INSTRUMENTS.forEach(key => { map[key] = key.charAt(0).toUpperCase() + key.slice(1); });
      return map[(instr || "").toLowerCase()] || instr;
    }

    function isComplete(members) {
      const instruments = members.map(m => normalizeLocal(m.instrument));
      return REQUIRED.every(r => instruments.includes(r));
    }

    function renderQueue(queue) {
      queueData = queue;
      if (!queue.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="center">${t("noOneYet")}</td></tr>`;
        return;
      }

      const positions = [...new Set(queue.map(p => p.position))].sort((a, b) => a - b);
      let nextUpPosition = null;
      for (const pos of positions) {
        const atPos = queue.filter(p => p.position === pos);
        if (atPos[0].status === "waiting") { nextUpPosition = pos; break; }
      }

      const rows = [];
      const seen = new Set();
      for (const p of queue) {
        if (seen.has(p.position)) continue;
        seen.add(p.position);
        rows.push(queue.filter(m => m.position === p.position));
      }

      tbody.innerHTML = rows.map(members => {
        const first = members[0];
        let rowClass = "";
        if (first.status === "played") rowClass = "row-played";
        else if (first.status === "missing") rowClass = "row-missing";
        else if (first.position === nextUpPosition) rowClass = "row-next";

        const isGroup = members.length > 1 || first.group_name;
        const isWaitingSolo = !isGroup && first.entry_type === "individual" && !first.group_name && first.status === "waiting";
        let nameCell = isGroup
          ? `<span class="badge">${first.group_name || "Group"}</span> ${members.map(m => m.name).join(", ")}`
          : first.name;
        if (isWaitingSolo) nameCell += ` <span class="badge badge-waiting">${t("waitingForBand")}</span>`;
        let instrCell = isGroup ? members.map(m => m.instrument).join(", ") : first.instrument;
        const joinedTime = first.created_at ? formatTime(first.created_at) : "\u2014";
        const isPlayed = first.status === "played";
        const isWaiting = first.status === "waiting";

        // Type cell with actions
        let typeCell = isGroup ? t("typeGroup") : t("typeSolo");

        // Play Again for played entries
        if (isPlayed) {
          const againBtns = members.map(m =>
            `<button class="small secondary" onclick="playAgain('${esc(m.name)}','${esc(m.instrument)}')">↻ ${m.name}</button>`
          ).join(" ");
          typeCell += `<div class="play-again-row">${againBtns}</div>`;
        }

        // Join button for waiting entries with a song that aren't complete yet
        const showJoin = isWaiting && first.song && !isComplete(members);
        if (showJoin) {
          const avail = availableInstruments(members);
          const opts = avail.map(key => `<option value="${t(key)}">${t(key)}</option>`).join("");
          typeCell += `
            <button class="small btn-join" onclick="toggleJoinForm(${first.position})">+ Join</button>
            <div class="join-form" id="join-form-${first.position}">
              <input type="text" id="join-name-${first.position}" placeholder="${t("namePlaceholder")}">
              <select id="join-instr-${first.position}">${opts}</select>
              <button class="small btn-join" onclick="submitJoin(${first.position})">OK</button>
            </div>`;
        }

        // Song cell + edit button for waiting entries
        let songCell = formatSongCell(first.song, first.position);
        if (isWaiting) {
          songCell += ` <button class="small btn-edit" onclick="openEditSongs(${first.position})" title="${t('editSong')}">✏️</button>`;
        }

        return `
          <tr class="${rowClass}">
            <td>${first.position}</td>
            <td>${nameCell}</td>
            <td>${instrCell}</td>
            <td>${songCell}</td>
            <td>${formatKeyCell(first.song)}</td>
            <td>${joinedTime}</td>
            <td>${typeCell}</td>
          </tr>`;
      }).join("");
    }

    function esc(str) { return (str || "").replace(/'/g, "\\'").replace(/"/g, "&quot;"); }

    // Returns array of {song, key} objects
    function parseSongs(songStr) {
      if (!songStr) return [];
      try {
        const parsed = JSON.parse(songStr);
        if (Array.isArray(parsed)) {
          return parsed.map(item =>
            typeof item === "string" ? { song: item, key: "Original Version" } : item
          );
        }
      } catch(e) {}
      // Legacy single song string
      return [{ song: songStr, key: "Original Version" }];
    }

    function formatSongCell(songStr, position) {
      const songs = parseSongs(songStr);
      if (!songs.length) return "\u2014";
      if (songs.length === 1) return songs[0].song;
      // Multiple songs — show count + button
      return `<button class="small btn-songs" onclick="showSongsPopup(${position})">\u266b ${songs.length} songs</button>`;
    }

    // Show distinct key(s): if all keys same, show one; otherwise comma-separated
    function formatKeyCell(songStr) {
      const songs = parseSongs(songStr);
      if (!songs.length) return "\u2014";
      const keys = songs.map(s => s.key || "Original Version");
      const distinct = [...new Set(keys)];
      return distinct.length === 1 ? distinct[0] : distinct.join(", ");
    }

    // Store songs data for popup
    let queueData = [];

    function showSongsPopup(position) {
      const members = queueData.filter(p => p.position === position);
      if (!members.length) return;
      const songs = parseSongs(members[0].song);
      const name = members[0].group_name || members[0].name;

      const popup = document.createElement("div");
      popup.className = "songs-popup";
      popup.onclick = (e) => { if (e.target === popup) popup.remove(); };
      popup.innerHTML = `
        <div class="songs-popup-box">
          <h3>\u266b ${name}</h3>
          <ol>${songs.map(s => `<li>${s.song} <span style="color:#8a7a60;">(${s.key || "Original Version"})</span></li>`).join("")}</ol>
          <div class="center mt-1"><button class="small" onclick="this.closest('.songs-popup').remove()">OK</button></div>
        </div>
      `;
      document.body.appendChild(popup);
    }

    function formatTime(utcStr) {
      const d = new Date(utcStr + "Z");
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function toggleJoinForm(pos) {
      const form = document.getElementById(`join-form-${pos}`);
      form.classList.toggle("active");
    }

    async function submitJoin(pos) {
      const name = document.getElementById(`join-name-${pos}`).value.trim();
      const instrument = document.getElementById(`join-instr-${pos}`).value;
      if (!name || !instrument) { alert(t("alertNameInstrument")); return; }

      const res = await fetch(`/api/register/join/${pos}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, instrument })
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error); }
      // SSE will update
    }

    async function playAgain(name, instrument) {
      await fetch("/api/register/repeat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, instrument })
      });
    }

    // --- Edit songs ---
    let editRowCount = 0;
    let editIsGroup = false;

    function openEditSongs(position) {
      const members = queueData.filter(p => p.position === position);
      if (!members.length) return;
      editIsGroup = members.length > 1 || !!members[0].group_name;
      const songs = parseSongs(members[0].song);
      const name = members[0].group_name || members[0].name;

      const numRows = editIsGroup ? Math.max(2, songs.length) : 1;
      editRowCount = numRows;

      // Placeholder divs that buildSongSelector will replace
      const rowsHtml = [];
      for (let i = 0; i < numRows; i++) {
        rowsHtml.push(`<div class="mt-1"><input type="text" id="edit-song-${i}"></div>`);
      }

      const popup = document.createElement("div");
      popup.className = "songs-popup";
      popup.id = "edit-popup";
      popup.onclick = (e) => { if (e.target === popup) popup.remove(); };
      popup.innerHTML = `
        <div class="songs-popup-box">
          <h3>✏️ ${name}</h3>
          <div id="edit-songs-list">${rowsHtml.join("")}</div>
          ${editIsGroup ? `<button class="small secondary" id="edit-add-song-btn" onclick="addEditSongRow()">+ ${t('addSong')}</button>` : ""}
          <div class="center mt-1">
            <button class="small" onclick="saveEditSongs(${position})">${t('save')}</button>
            <button class="small secondary" onclick="this.closest('.songs-popup').remove()">${t('back')}</button>
          </div>
        </div>
      `;
      document.body.appendChild(popup);

      // Build dropdown selectors pre-filled with the current songs
      for (let i = 0; i < numRows; i++) {
        const s = songs[i] || { song: "", key: "Original Version" };
        buildSongSelector("edit-song-" + i, s.song || "", s.key || "Original Version");
      }
    }

    function addEditSongRow() {
      if (editRowCount >= 4) return;
      const list = document.getElementById("edit-songs-list");
      const div = document.createElement("div");
      div.className = "mt-1";
      div.innerHTML = `<input type="text" id="edit-song-${editRowCount}">`;
      list.appendChild(div);
      buildSongSelector("edit-song-" + editRowCount, "", "Original Version");
      editRowCount++;
      if (editRowCount >= 4) {
        document.getElementById("edit-add-song-btn").style.display = "none";
      }
    }

    async function saveEditSongs(position) {
      const songObjs = [];
      for (let i = 0; i < editRowCount; i++) {
        const obj = getSongObject("edit-song-" + i);
        if (obj) songObjs.push(obj);
      }

      if (editIsGroup && songObjs.length === 1) {
        alert(getLang() === "es" ? "Los grupos deben elegir entre 2 y 4 canciones." : "Groups must choose between 2 and 4 songs.");
        return;
      }

      const res = await fetch(`/api/queue/${position}/songs`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ songObjs })
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error); return; }
      document.getElementById("edit-popup")?.remove();
      // SSE will refresh
    }

    // Initial load
    fetch("/api/queue").then(r => r.json()).then(renderQueue);
    const evtSource = new EventSource("/api/events");
    evtSource.onmessage = (event) => { renderQueue(JSON.parse(event.data)); };
  </script>
</body>
</html>
