<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jam Queue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>&#127925; Jam Queue &#127925;</h1>
  <p class="subtitle">"It's the music that keeps us all in line." &mdash; Robert Plant</p>

  <div class="container">
    <p class="center mb-1" style="color:#aaa;">Live performance order &mdash; updates automatically</p>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Instrument</th>
          <th>Song</th>
          <th>Type</th>
        </tr>
      </thead>
      <tbody id="queue-body">
        <tr><td colspan="5" class="center">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="center mt-1">
    <button onclick="window.location.href='index.html'">Home</button>
    <button class="secondary" onclick="window.location.href='register.html'">Join the Jam</button>
  </div>

  <div class="blues-quote">
    "I've been down so long, it looks like up to me."
    <span class="author">&mdash; Muddy Waters</span>
  </div>

  <script>
    const tbody = document.getElementById("queue-body");

    function renderQueue(queue) {
      if (!queue.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="center">No one signed up yet. Be the first!</td></tr>';
        return;
      }

      // Find the first position that is still "waiting" — that's "next up"
      const positions = [...new Set(queue.map(p => p.position))].sort((a, b) => a - b);
      let nextUpPosition = null;
      for (const pos of positions) {
        const atPos = queue.filter(p => p.position === pos);
        if (atPos[0].status === "waiting") {
          nextUpPosition = pos;
          break;
        }
      }

      tbody.innerHTML = queue.map(p => {
        let rowClass = "";
        if (p.status === "played") rowClass = "row-played";
        else if (p.status === "missing") rowClass = "row-missing";
        else if (p.position === nextUpPosition) rowClass = "row-next";

        return `
          <tr class="${rowClass}">
            <td>${p.position}</td>
            <td>${p.group_name ? `<span class="badge">${p.group_name}</span>` : ""}${p.name}</td>
            <td>${p.instrument}</td>
            <td>${p.song || "\u2014"}</td>
            <td>${p.entry_type === "group" ? "Group" : "Solo"}</td>
          </tr>
        `;
      }).join("");
    }

    // Initial load
    fetch("/api/queue").then(r => r.json()).then(renderQueue);

    // Live updates via SSE
    const evtSource = new EventSource("/api/events");
    evtSource.onmessage = (event) => {
      renderQueue(JSON.parse(event.data));
    };
  </script>
</body>
</html>
